# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Codex owns routine review; security guidance now lives in AGENTS.md.
# Retain an explicit opt-out: deleting this file can restore the shared App's
# automatic-review defaults. Do not uninstall the organization-wide GitHub App.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    description_keyword: ""
    labels: []
  auto_approvals:
    enabled: false
chat:
  auto_reply: false
