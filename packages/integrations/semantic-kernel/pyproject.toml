[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cred-semantic-kernel"
version = "2.0.0"
description = "Cred Semantic Kernel integration — credential delegation plugin for Microsoft Semantic Kernel agents"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Cred", email = "hello@cred.ninja" }]
keywords = ["cred", "semantic-kernel", "microsoft", "oauth", "delegation", "ai-agents"]
dependencies = [
    "cred-auth>=2.0.0,<3.0.0",
    "semantic-kernel>=1.0",
]

[project.urls]
Homepage = "https://cred.ninja"
Repository = "https://github.com/cred-ninja/sdk"
Documentation = "https://cred.ninja/docs"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["cred_semantic_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
