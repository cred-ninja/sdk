[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cred-openai-agents"
version = "1.0.0"
description = "Cred OpenAI Agents SDK integration — credential delegation FunctionTool"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Cred", email = "hello@cred.ninja" }]
keywords = ["cred", "openai", "agents", "oauth", "delegation", "ai-agents"]
dependencies = [
    "cred-auth>=1.0.0",
    "openai-agents>=0.1",
]

[project.urls]
Homepage = "https://cred.ninja"
Repository = "https://github.com/cred-ninja/sdk"
Documentation = "https://cred.ninja/docs"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["cred_openai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
