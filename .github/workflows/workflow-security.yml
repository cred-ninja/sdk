name: Workflow Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact-version workflow security tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-tools"
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/python" -m pip install 'zizmor==1.32.0'
      - name: Validate GitHub Actions syntax
        run: '"$RUNNER_TEMP/ci-tools/actionlint" -color'
      - name: Audit workflow security offline (plain output, not SARIF)
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format plain .github/workflows'
      - name: Exercise exact scanner exceptions and tracked-tree export
        run: node --test scripts/ci/scanner.probe.mjs
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-tools/gitleaks
      - name: Scan tracked public snapshot with redacted Gitleaks CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-snapshot"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/public-snapshot"
          cd "$RUNNER_TEMP/public-snapshot"
          "$RUNNER_TEMP/ci-tools/gitleaks" dir . --redact=100 --no-banner
