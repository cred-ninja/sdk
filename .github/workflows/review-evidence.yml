name: Invalidate Changed CodeRabbit Evidence
on:
  check_run:
    types: [created, completed, rerequested]
permissions:
  contents: read
jobs:
  invalidate:
    if: github.event.check_run.app.slug == 'coderabbitai'
    name: Invalidate changed CodeRabbit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # check_run loads trusted default-branch code; never execute PR content.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/review-gate.mjs invalidate-check
        env:
          GH_TOKEN: ${{ github.token }}
