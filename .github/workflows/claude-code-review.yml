name: Claude Code Review
on:
  # Trusted base scripts only, no PR checkout/dependencies/tools. PR diff is API data.
  pull_request_target: # zizmor: ignore[dangerous-triggers] isolated data-only reviewers; checks writer is a separate job
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened, edited, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: strict-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Verify native reviewer runtime (no model credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/claude-runtime.mjs fetch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-claude-native
          path: ${{ runner.temp }}/claude-runtime/claude
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  prepare:
    name: Initialize Review Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: write
      actions: read
    outputs:
      snapshot: ${{ steps.begin.outputs.snapshot }}
      check: ${{ steps.begin.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: begin
        run: node scripts/ci/review-gate.mjs begin
        env:
          GH_TOKEN: ${{ github.token }}
  security:
    name: Claude Security Review
    needs: [prepare, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.review.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Use the hosted runner's preinstalled Node; no runtime/package installers.
      - id: prompt
        run: node scripts/ci/review-gate.mjs prompt
        env:
          SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          REVIEW_KIND: security
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-claude-native
          path: ${{ runner.temp }}/claude-runtime
      - run: node scripts/ci/claude-runtime.mjs verify
      - id: review
        run: node scripts/ci/claude-runtime.mjs review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
  diff:
    name: Independent Diff and Issue Review
    needs: [prepare, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.review.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Use the hosted runner's preinstalled Node; no runtime/package installers.
      - id: prompt
        run: node scripts/ci/review-gate.mjs prompt
        env:
          SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          REVIEW_KIND: diff
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-claude-native
          path: ${{ runner.temp }}/claude-runtime
      - run: node scripts/ci/claude-runtime.mjs verify
      - id: review
        run: node scripts/ci/claude-runtime.mjs review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
  publish:
    name: Publish Review Gate
    needs: [prepare, security, diff]
    # Failed/skipped reviewers cause a FAILURE; this is not an always-green mask.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/review-gate.mjs finish
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
          CHECK_ID: ${{ needs.prepare.outputs.check }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DIFF_RESULT: ${{ needs.diff.result }}
          SECURITY_PASSED: ${{ needs.security.outputs.passed }}
          DIFF_PASSED: ${{ needs.diff.outputs.passed }}
