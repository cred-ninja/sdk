name: Invalidate Changed Issue Reviews
on:
  issues:
    types: [edited, deleted, transferred]
permissions:
  contents: read
jobs:
  invalidate:
    name: Invalidate issue context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Issue events load the default branch version, never a PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/review-gate.mjs invalidate
        env:
          GH_TOKEN: ${{ github.token }}
