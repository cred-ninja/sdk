name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run release:hygiene

  # Gate: blocks the PR only on high/critical advisories in production
  # dependencies. Moderate/low and dev-only findings are surfaced by
  # audit-full-report instead, non-blocking -- gating on every moderate
  # finding trains people to ignore a red Audit check (docs/solutions
  # has the writeup on why we split this).
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # Report: full audit including moderate/low and dev dependencies.
  # Never blocks the PR -- it's here for visibility so findings don't
  # go undetected between the high/critical gate above and the next
  # time someone runs `npm audit` by hand.
  audit-full-report:
    name: Audit (full report, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=moderate

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Build dependencies first — SDK and server tests import vault/oauth at runtime
      - name: Build @credninja/protocol
        run: npm run build --workspace=packages/protocol

      - name: Build @credninja/oauth
        run: npm run build --workspace=packages/oauth

      - name: Build @credninja/tofu
        run: npm run build --workspace=packages/tofu

      - name: Build @credninja/vault
        run: npm run build --workspace=packages/vault

      - name: Build @credninja/guard
        run: npm run build --workspace=packages/guard

      - name: Build @credninja/sdk
        run: npm run build --workspace=packages/sdk

      - name: Test @credninja/oauth
        run: npm test --workspace=packages/oauth

      - name: Test @credninja/tofu
        run: npm test --workspace=packages/tofu

      - name: Test @credninja/vault
        run: npm test --workspace=packages/vault

      - name: Test @credninja/guard
        run: npm test --workspace=packages/guard

      - name: Test @credninja/sdk
        run: npm test --workspace=packages/sdk

      - name: Test @credninja/mcp
        run: npm test --workspace=packages/mcp

      - name: Test @credninja/server
        run: npm test --workspace=packages/server

      - name: Test @credninja/ai
        run: npm test --workspace=packages/integrations/vercel-ai

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build @credninja/protocol
        run: npm run build --workspace=packages/protocol

      - name: Build @credninja/oauth
        run: npm run build --workspace=packages/oauth

      - name: Build @credninja/tofu
        run: npm run build --workspace=packages/tofu

      - name: Build @credninja/vault
        run: npm run build --workspace=packages/vault

      - name: Build @credninja/guard
        run: npm run build --workspace=packages/guard

      - name: Build @credninja/sdk
        run: npm run build --workspace=packages/sdk

      - name: Build @credninja/server
        run: npm run build --workspace=packages/server

      - name: Build @credninja/ai
        run: npm run build --workspace=packages/integrations/vercel-ai

      - name: Build @credninja/mcp
        run: npm run build --workspace=packages/mcp

      - name: Pack create-cred-app
        run: npm pack --dry-run ./packages/create-cred-app

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Smoke fresh npm package installs
        run: npm run smoke:npm
