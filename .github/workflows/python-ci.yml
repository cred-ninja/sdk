name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-python:
    name: SDK Python (${{ matrix.python-version }})
    # setup-python has no Python 3.9 build for Ubuntu 26.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/sdk-python/pyproject.toml

      - name: Install SDK Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'packages/sdk-python[dev]'

      - name: Test SDK Python
        run: python -m pytest packages/sdk-python/tests

      - name: Typecheck SDK Python
        run: python -m mypy --strict packages/sdk-python/cred

  integrations:
    name: Python Integration (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/integrations/langchain
          - packages/integrations/crewai
          - packages/integrations/openai-agents
          - packages/integrations/autogen
          - packages/integrations/semantic-kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            packages/sdk-python/pyproject.toml
            ${{ matrix.package }}/pyproject.toml

      - name: Install SDK Python + integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/sdk-python
          python -m pip install -e '${{ matrix.package }}[dev]'

      - name: Test integration package
        run: python -m pytest '${{ matrix.package }}/tests'

      - name: Exercise native registration and dispatch
        env:
          INTEGRATION_PACKAGE: ${{ matrix.package }}
          OTEL_SDK_DISABLED: 'true'
        run: |
          export CRED_NATIVE_ADAPTERS="${INTEGRATION_PACKAGE##*/}"
          python -m pytest scripts/test_python_native_dispatch.py scripts/test_python_integration_support.py

  # Every package in one environment: proves they install together, which the
  # per-package jobs above cannot. Pinned by scripts/python-test-constraints.txt.
  combined:
    name: Python Combined (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/python-test-constraints.txt

      - name: Test every Python package together
        run: bash scripts/test-python-packages.sh

  wheel-smoke:
    name: Python Wheel Smoke (${{ matrix.python-version }})
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/sdk-python/pyproject.toml
            packages/integrations/**/pyproject.toml

      - name: Smoke fresh Python wheel installs
        run: bash scripts/smoke-python-wheels.sh

  framework-minimum:
    name: Python Framework Minimum (${{ matrix.adapter }})
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: langchain
            framework: langchain-core==0.2.0
            python: '3.9'
          - adapter: crewai
            framework: crewai==0.11.0
            python: '3.10'
          - adapter: openai-agents
            framework: openai-agents==0.1.0
            python: '3.10'
          - adapter: autogen
            # Test the declared floor, even though upstream yanked this release.
            framework: autogen-core==0.4.0
            python: '3.10'
          - adapter: semantic-kernel
            framework: semantic-kernel==1.0.0
            python: '3.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Native dispatch from independent minimum-framework wheels
        env:
          CRED_WHEEL_ADAPTERS: ${{ matrix.adapter }}
          CRED_WHEEL_FRAMEWORK_PIN: ${{ matrix.framework }}
        run: bash scripts/smoke-python-wheels.sh
